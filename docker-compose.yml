version: '3.8'
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/highlyagent
      - REDIS_URL=redis://redis:6379
    depends_on: [db, redis]
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: highlyagent
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
  redis:
    image: redis:7-alpine
